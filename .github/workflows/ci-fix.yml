name: Ask agent to fix red CI

# When CI fails on an agent branch (claude/*), ask the agent to fix it on that PR.
# Max 2 attempts per PR, then label hold. Never merges anything.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  fix:
    if: >-
      vars.AGENTS_PAUSED != 'true' &&
      github.event.workflow_run.conclusion == 'failure' &&
      startsWith(github.event.workflow_run.head_branch, 'claude/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ secrets.PRM_BOT_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -uo pipefail
          [ -n "$GH_TOKEN" ] || { echo "PRM_BOT_TOKEN not set"; exit 0; }
          n=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          [ -n "$n" ] || { echo "no open PR for $BRANCH"; exit 0; }
          bodies=$(gh api "repos/$REPO/issues/$n/comments" --jq '.[].body')
          echo "$bodies" | grep -q "$SHA" && { echo "already asked for $SHA"; exit 0; }
          tries=$(echo "$bodies" | grep -c '^@claude CI failed' || true)
          if [ "$tries" -ge 2 ]; then
            gh pr edit "$n" -R "$REPO" --add-label hold
            gh pr comment "$n" -R "$REPO" --body "CI still red after 2 agent fixes. Labeled hold for Lucas."
          else
            gh pr comment "$n" -R "$REPO" --body "@claude CI failed on $SHA ($RUN_URL). Read the failing output, fix it on this branch, keep every test passing. Do not weaken or skip tests."
          fi
