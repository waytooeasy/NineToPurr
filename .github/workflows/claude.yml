name: Claude build agent

# Lucas starts an agent by commenting "@claude ..." on an issue or PR.
# Only his account can trigger it. The agent always ends with a PR; it never merges.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      github.actor == 'waytooeasy' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System tools for tests
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg sqlite3

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 40
            --allowedTools "Bash(python3:*),Bash(python:*),Bash(pip install:*),Bash(pytest:*),Bash(sqlite3:*),Bash(ffmpeg:*),Bash(ffprobe:*),Bash(git:*),Bash(ls:*),Bash(cat:*)"
            --append-system-prompt "You are a PRM build agent. Read CLAUDE.md, clipper/docs/STRATEGY.md and clipper/docs/DECISIONS.md first. Work only in the module the issue names. Add pytest tests that run offline with sample data. Update the module README. Never edit .github/workflows/, DECISIONS.md or anything with secrets. If a decision is needed, say so in your comment and build around it."
