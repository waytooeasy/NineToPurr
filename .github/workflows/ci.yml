name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg sqlite3
          pip install pytest
          if [ -f clipper/requirements-dev.txt ]; then pip install -r clipper/requirements-dev.txt; fi
      - name: Python compiles
        run: python -m compileall -q clipper
      - name: Schema + migrations apply cleanly
        run: |
          db=$(mktemp)
          sqlite3 "$db" < clipper/db/schema.sql
          sqlite3 "$db" < clipper/db/ledger.sql
          for f in $(ls clipper/db/migrations/*.sql 2>/dev/null | sort); do echo "apply $f"; sqlite3 "$db" < "$f"; done
          sqlite3 "$db" < clipper/db/math.sql > /dev/null
      - name: Tests
        run: |
          if ls clipper/*/tests 1>/dev/null 2>&1 || ls clipper/*/test_*.py 1>/dev/null 2>&1; then pytest -q clipper; else echo "no tests yet"; fi
