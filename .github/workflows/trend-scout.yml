name: Trend Scout (daily)

# Runs the market-research agent in GitHub's cloud every morning (no home PC needed).
# Metadata only: titles, lengths, views/hour, upload times of competitor Shorts. Never downloads videos.
# Output: a "Trends <date>" issue for Lucas + library.md on the `trends` branch (main stays clean).
on:
  schedule:
    - cron: "30 10 * * *"   # 07:30 Asunción
  workflow_dispatch:

concurrency:
  group: trend-scout
  cancel-in-progress: false

jobs:
  scout:
    if: vars.AGENTS_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Skip until the scout exists
        id: has
        run: |
          if [ -f clipper/analyst/trend_scout.py ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "trend_scout.py not built yet (#20)"; fi
      - name: Install
        if: steps.has.outputs.ok == '1'
        run: pip install -q -r clipper/requirements-dev.txt anthropic yt-dlp
      - name: Run scout
        if: steps.has.outputs.ok == '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python clipper/analyst/trend_scout.py --library clipper/formats/library.md --report report.md
      - name: Publish report issue + library branch
        if: steps.has.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d=$(date -u +%F)
          gh issue create --title "Trends $d" --body-file report.md --label trends || gh issue create --title "Trends $d" --body-file report.md
          git config user.name "trend-scout"; git config user.email "actions@users.noreply.github.com"
          cp clipper/formats/library.md /tmp/library.md
          git fetch -q origin trends && git checkout -q -B trends origin/trends || git checkout -q --orphan trends
          git rm -rq . 2>/dev/null || true
          mkdir -p clipper/formats && cp /tmp/library.md clipper/formats/library.md
          git add clipper/formats/library.md && git commit -qm "trends $d" && git push -q origin trends || echo "no change"
