name: Agent PR review

# Reviews every agent PR (claude/*) with the reviewer subagent and posts a verdict for Lucas.
on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: startsWith(github.head_ref, 'claude/') && vars.AGENTS_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r clipper/requirements-dev.txt
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Use the reviewer subagent on PR #${{ github.event.pull_request.number }} (diff vs origin/main).
            Post its verdict as one PR comment with `gh pr comment ${{ github.event.pull_request.number }} --body-file -`.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 12
            --allowedTools "Read,Grep,Glob,Task,Bash(git diff:*),Bash(git log:*),Bash(pytest:*),Bash(python3:*),Bash(gh pr comment:*)"
