# Streamer watchlist for the Heat Index (D33). Config-only: add/remove a line to change it.
# platform: twitch | youtube | kick. id = Twitch login, YouTube channel handle (@x) or UC id, Kick slug.
# Several entries may share a `name` (their numbers are summed). `disabled: true` = kept, not polled.
# Kick = channel slug from kick.com/<slug> (D45). An unknown login/slug is logged and skipped.
# own_captions: true = the stream already shows live captions; the Editor adds no captions of its own
# (two caption tracks on one Short, Sykkuno 2026-10-20). Hook + watermark stay.
# daily_cap = Shorts slots per day (D52: 6, like the most active top clippers; paced one every 4 h).
daily_cap: 6
max_per_streamer: 2
explore_days: 3
explore_top_n: 15

