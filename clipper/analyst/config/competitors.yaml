# Streamer-clip Shorts channels Trend Scout studies (D29: format research only, metadata only,
# never downloaded or re-uploaded). channel_id = the UC... id (youtube.com/channel/UC...).
# Entries with an empty channel_id are skipped with a warning: fill them in (HQ).
# streamers = who the channel mostly clips (fallback when a title names nobody).
channels:
  - name: Kai Cenat clips 1
    channel_id: ""
    streamers: [Kai Cenat]
  - name: Kai Cenat clips 2
    channel_id: ""
